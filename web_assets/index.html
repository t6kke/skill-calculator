<!doctype html>
<html lang="en" class="no-js">
<head>
    <link rel="icon" href="./image/icon.png" type="image/x-icon">
    <title>Skill Calculator</title>
	<meta name="BSC" content="BSC">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/modern-business.css" rel="stylesheet">
    <link href="./font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
</head>

<body>
    <!-- Navigation -->
    <div id="navigator"></div>

    <!-- Page Content -->
    <div class="container">

        <!-- Page Heading/Breadcrumbs -->
        <div class="row">
            <div class="col-lg-12">
                <h1 class="page-header">Skill Calculator</h1>
            </div>
        </div>
        <!-- /.row -->

        <!-- Content Row -->
        <div class="row">
            <div class="col-lg-12">
                <div id="conent-section">

                    <div class="col-lg-12">
                        <h2>Public Leagues</h2>
                        <ul id="league-list"></ul>
                    </div>

                    <div id="league-display" style="display: none">
                        <h2>Selected League: <span id="league-title-display"></span></h2>
                        <p id="league-description-display"></p>

                        <div id="league-handling-forms">
                            <div class="col-lg-12">
                                <div id="current-standings-container">
                                    <h3>Current Standings</h3>
                                    <div id="standings"> </div>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div id="bsc-response"></div>
                                <div id="tournaments-list-container">
                                    <h3>Tournaments in League</h3>
                                    <ul id="tournamnet-list"></ul>
                                </div>
                            </div>

                            <div id="tournament-result-container" class="col-lg-12">
                                <h3>Tournament Result</h3>
                                <div id="tournament-result-report"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- /.row -->

        <!-- Footer -->
        <footer>
            <hr>
			<div id="footer"></div>
        </footer>

    </div>
    </div>
    <!-- /.container -->

    <!-- jQuery -->
    <script src="./js/jquery.js"></script>

    <!-- My json for working with go server functionality -->
    <script src="./js/public.js" defer></script>

	<script>
	$(function(){
		$("#navigator").load("navigator.html");
		$("#footer").load("footer.html");
	});
	</script>

</body>

</html>
